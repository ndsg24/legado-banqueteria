name: Verify private API
on:
  pull_request:
    paths: ['apps/api/**', 'apps/admin/**', 'libs/**', 'package*.json', 'compose.yaml', '.dockerignore', 'tools/init-pilot.mjs', 'tools/eslint/api-boundaries.js', 'eslint.config.js', '.github/workflows/api.yml']
  push:
    branches: [main]
    paths: ['apps/api/**', 'apps/admin/**', 'libs/**', 'package*.json', 'compose.yaml', '.dockerignore', 'tools/init-pilot.mjs', 'tools/eslint/api-boundaries.js', 'eslint.config.js', '.github/workflows/api.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run pilot:init
      - run: docker compose up -d --build --wait
      - run: npm run test:api
      - run: npm run test:admin
      - if: always()
        run: docker compose down -v
